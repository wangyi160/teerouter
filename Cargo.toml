[package]
name = "teellm"
version = "0.1.0"
edition = "2024"
autotests = false
publish = false
repository = "https://github.com/wangyi160/teerouter"
rust-version = "1.88"
description = "Standalone Rust LLM router for OpenAI, Claude and Grok"
license = "MIT"
readme = "README.md"
include = ["/src/**", "/tests/**", "/docs/**", "/config.example.toml", "/config.oauth.example.toml", "/provision*.json", "/protocol-update.example.json", "/restrictions-update.example.json", "/Cargo.toml", "/Cargo.lock", "/README.md", "/ARCHITECTURE.md", "/SECURITY-TEE.md", "/OPERATIONS.md", "/LICENSE", "/LICENSES/**", "/NOTICE", "/UPSTREAM.json"]

[features]
# Intel TDX evidence from the measured dstack guest over its local Unix socket.
dstack-tdx = []
# Explicit Workbuddy test upstream; independent of real TDX vs sample evidence.
# Builds without this feature cannot deserialize the non-official provider.
workbuddy-lab = []
# Explicitly non-TEE development evidence; never enabled by production builds.
sample-demo = []

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
zeroize = "1.8"
subtle = "2"
ring = "0.17"
thiserror = "2"
tiktoken-rs = "=0.12.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "time", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
tower-layer = "0.3"
tower-service = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
sev = { version = "=8.0.0", default-features = false, features = ["snp", "serde"] }

[dev-dependencies]
tempfile = "3"
rstest = "0.26"

[[test]]
name = "memory_cli"
path = "tests/memory_cli.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
